org.gradle.caching=true
org.gradle.configuration-cache=true
# The heap and metaspace sizes are the Gradle defaults, which setting jvmargs would otherwise drop.
org.gradle.jvmargs=-Xmx512m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8

# The version of the next release, without -SNAPSHOT: the build appends it unless it runs with
# -Prelease. The release workflow raises the patch number after each release.
cribro.version=1.1.0
