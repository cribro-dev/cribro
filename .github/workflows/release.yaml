name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        required: false
        type: string
        default: ''
        description: Release version, x.y.z without v (defaults to cribro.version in gradle.properties)

permissions:
  contents: read

jobs:
  publish-release:
    name: Publish release
    runs-on: ubuntu-latest
    permissions:
      # Pushes the version commits, creates the tag and the GitHub release
      contents: write
      # release-drafter reads the merged pull requests for the release notes
      pull-requests: read
    steps:
      - name: Validate input parameters
        env:
          VERSION: ${{ inputs.version }}
          PUBLISH_TO_CENTRAL: ${{ vars.PUBLISH_TO_CENTRAL != 'false' }}
          PUBLISH_TO_PLUGIN_PORTAL: ${{ vars.PUBLISH_TO_PLUGIN_PORTAL != 'false' }}
        # language=bash
        run: |
          # A release that publishes nowhere would still create the tag and the GitHub release
          if [[ "$PUBLISH_TO_CENTRAL" != "true" && "$PUBLISH_TO_PLUGIN_PORTAL" != "true" ]]; then
            echo "Error: the PUBLISH_TO_CENTRAL and PUBLISH_TO_PLUGIN_PORTAL repository variables both disable publishing. Enable at least one of them."
            exit 1
          fi

          BRANCH_NAME=${GITHUB_REF##refs/heads/}
          if [[ ! "$BRANCH_NAME" =~ ^(main|release/.+)$ ]]; then
            echo "Error: a release runs from main or release/**, got '$BRANCH_NAME'"
            exit 1
          fi

          if [[ -n "$VERSION" && ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: the version must be blank or x.y.z, got '$VERSION'"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get the release version
        id: release_version
        env:
          VERSION: ${{ inputs.version }}
        # language=bash
        run: |
          if [[ -n "$VERSION" ]]; then
            echo "Release version from the workflow input: $VERSION"
          else
            VERSION=$(grep "^cribro.version=" gradle.properties | cut -d'=' -f2)
            echo "Release version from gradle.properties: $VERSION"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check that the tag does not exist
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          VERSION: ${{ steps.release_version.outputs.version }}
        with:
          # language=javascript
          script: |
            const tag = `v${process.env.VERSION}`;
            const { data: tags } = await github.rest.git.listMatchingRefs({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `tags/${tag}`
            });
            if (tags.length > 0) {
              core.setFailed(`Tag ${tag} already exists. Raise cribro.version in gradle.properties and run the release again.`);
            }

      - name: Prepare git name and email
        # language=bash
        run: |
          # See https://github.com/actions/checkout?tab=readme-ov-file#push-a-commit-using-the-built-in-token
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set the version in gradle.properties to ${{ steps.release_version.outputs.version }}
        uses: $/.github/actions/update_version
        with:
          token: ${{ github.token }}
          version: ${{ steps.release_version.outputs.version }}

      # The tag goes on this commit, the one the steps below build, even if main moves on meanwhile.
      - name: Record the release commit
        id: release_commit
        # language=bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Gradle runs on it and uses it as the JDK 25 toolchain.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25

      # No cache: an entry written by another workflow could change what the release ships.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true

      # The artifacts are published before the tag, so a failed upload leaves no tag to drop; the
      # version commit above stays on the branch, and a rerun finds gradle.properties up to date.
      # Neither registry lets a version be published twice, so on a rerun after one of them has
      # accepted the release, set its variable (PUBLISH_TO_CENTRAL or PUBLISH_TO_PLUGIN_PORTAL) to
      # 'false'. Central goes first because its validation rejects a deployment before anything
      # is released.
      - name: Publish to Maven Central
        if: ${{ vars.PUBLISH_TO_CENTRAL != 'false' }}
        run: ./gradlew --quiet -Prelease -PcentralPortalPublishingType=AUTOMATIC publishAggregationToCentralPortal
        env:
          CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          CENTRAL_PORTAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
          SIGNING_PGP_PRIVATE_KEY: ${{ secrets.RELEASE_PGP_PRIVATE_KEY }}
          SIGNING_PGP_PASSPHRASE: ${{ secrets.RELEASE_PGP_PASSPHRASE }}

      - name: Publish to the Gradle Plugin Portal
        if: ${{ vars.PUBLISH_TO_PLUGIN_PORTAL != 'false' }}
        run: ./gradlew --quiet -Prelease :cribro-gradle-plugin:publishPlugins
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
          SIGNING_PGP_PRIVATE_KEY: ${{ secrets.RELEASE_PGP_PRIVATE_KEY }}
          SIGNING_PGP_PASSPHRASE: ${{ secrets.RELEASE_PGP_PASSPHRASE }}

      - name: Publish the GitHub release
        uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        with:
          publish: true
          commitish: ${{ steps.release_commit.outputs.sha }}
          latest: ${{ github.ref_name == github.event.repository.default_branch }}
          version: ${{ steps.release_version.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute the next patch version
        id: next_version
        env:
          RELEASE_VERSION: ${{ steps.release_version.outputs.version }}
        # language=bash
        run: |
          IFS='.' read -r major minor patch <<< "$RELEASE_VERSION"
          next_version="${major}.${minor}.$((patch + 1))"
          echo "Next version: $next_version"
          echo "version=$next_version" >> "$GITHUB_OUTPUT"

      - name: Set the version in gradle.properties to ${{ steps.next_version.outputs.version }}
        uses: $/.github/actions/update_version
        with:
          token: ${{ github.token }}
          version: ${{ steps.next_version.outputs.version }}
