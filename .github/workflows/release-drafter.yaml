name: Release Drafter

on:
  push:
    branches:
      - main

permissions: read-all

jobs:
  update_release_draft:
    name: Update the release draft
    runs-on: ubuntu-latest
    permissions:
      # Creates and edits the draft release
      contents: write
      # Reads the merged pull requests for the release notes
      pull-requests: read
    steps:
      - name: Read the version from gradle.properties
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: current_version
        with:
          # language=javascript
          script: |
            const response = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: 'gradle.properties',
              ref: context.sha
            });
            const content = Buffer.from(response.data.content, 'base64').toString();
            const version = content.match(/^cribro\.version=(.+)$/m)[1];
            console.log(`Version is ${version}`);
            return version;

      - name: Update the release draft
        uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        with:
          publish: false
          latest: true
          version: ${{ steps.current_version.outputs.result }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
